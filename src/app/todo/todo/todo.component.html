<div class="row">
  <div class="col">
    <ol class="list-group">
      @for (todo of todos(); track $index) {
        <li
          (click)="deleteTodo(todo)"
          class="list-group-item">
          {{todo.name}} {{todo.content}}
          <i
            class="bi bi-trash2"></i>
        </li>
      }
    </ol>
        <ol class="list-group">
          @for (todoApi of todosApi(); track todoApi.id) {
          <li  class="list-group-item" [class]="{
          'list-group-item-success':todoApi.completed,
          'list-group-item-danger':!todoApi.completed
        }">
            {{todoApi.title}}
          </li>
          }
        </ol>
  </div>
  <div class="col">
    name:
    <input [(ngModel)]="todo().name" type="text" class="form-control" /> content:
    <input [(ngModel)]="todo().content" type="text" class="form-control" />
    <button
      [disabled]="!todo().name.trim || !todo().content.trim()"
      (click)="addTodo()"
      class="btn btn-primary m-2"
    >
      add
    </button>
  </div>
</div>
<app-test-rxjs/>
